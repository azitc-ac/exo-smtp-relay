# Fortlaufende Prüfung bei jedem Push und Pull Request — Tests, Spiegelprüfung,
# Container-Build. Läuft auch, wenn dieser Baum später in ein eigenes
# Repository gehoben wird: nichts hier setzt das Gateway voraus.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Wöchentlich auch ohne Push: Neue Lücken in den festgenagelten
  # Abhängigkeiten (pip-audit unten) entstehen, ohne dass sich der Code ändert.
  schedule:
    - cron: "17 4 * * 1"

jobs:
  tests:
    name: Tests und Prüfskripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten
        run: |
          pip install --require-hashes --only-binary :all: -r app/requirements.lock
          pip install -r tests/requirements.txt
      - name: Tests
        run: pytest tests/ -v

      # Standardwerkzeuge wie im Gateway (seit v1.11.6). Fassungen gepinnt wie
      # alles andere. pip-audit prüft GENAU den Baum, der installiert wird
      # (Lock-Datei); --no-deps, weil die Lock-Datei bereits vollständig
      # aufgelöst ist.
      - name: Bekannte Lücken in Abhängigkeiten (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r app/requirements.lock --require-hashes --no-deps --disable-pip --progress-spinner off

      # Lieferkette: Die Prüfsummen in der Lock-Datei entsprechen PyPI, und jede
      # Zielplattform (win_amd64, manylinux x86_64/aarch64, Python 3.11–3.13) hat
      # für jedes Paket ein Wheel. Sonst bricht die Installation beim Kunden ab.
      - name: Prüfsummen der Lock-Datei (PyPI) und Wheel-Abdeckung
        run: |
          python tools/lock_hashes.py pruefen
          python tools/lock_hashes.py abdeckung

      # Nur hohe Schwere UND hohe Sicherheit — sonst geht das Signal im
      # Rauschen unter (subprocess, assert …). Bewusste Ausnahmen stehen
      # als `# nosec Bxxx` mit Begründung an der Stelle.
      - name: Sicherheitsmuster (bandit)
        run: |
          pip install bandit==1.9.4
          bandit -q -r app -lll -iii

      # Fehlerklassen, die zur Laufzeit erst knallen (undefinierte Namen,
      # unbenutzte Zuweisungen …). F401/F811 (unbenutzte bzw. doppelte
      # Importe) bleiben aus wie im Gateway: Sie treffen auch gespiegelte
      # Dateien (secure_io.py), die nur dort geändert werden dürfen.
      - name: Python-Fehlerklassen (ruff)
        run: |
          pip install ruff==0.17.4
          ruff check app --select F --ignore F401,F811

      - name: Spiegelprüfung
        run: python tools/driftcheck.py

      # Release-Pakete bauen wie in release.yml — ohne Signatur und ohne
      # Veröffentlichung. Fällt hier auf, bevor ein Tag daran scheitert.
      - name: Release-Pakete bauen (Probe)
        run: |
          python tools/release.py bauen dist-probe
          cd dist-probe && sha256sum -c --strict SHA256SUMS

  windows:
    name: Tests unter Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten
        run: |
          pip install --require-hashes --only-binary :all: -r app/requirements.lock
          pip install -r tests/requirements.txt
      - name: Tests
        run: pytest tests/ -v
      - name: PowerShell 5.1 parst die Skripte
        shell: powershell
        run: |
          foreach ($s in (Get-ChildItem app\scripts\*.ps1, windows\*.ps1, tests\*.ps1, tools\*.ps1)) {
            $fehler = $null
            [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$fehler) | Out-Null
            if ($fehler.Count -gt 0) { $fehler | ForEach-Object { Write-Host $_.ToString() }; throw "Parse-Fehler in $($s.Name)" }
            Write-Host "OK $($s.Name)"
          }

  # Labtest 0.2.45: install.ps1 brach unter PS 5.1 an einer Datei ab, die der Administrator
  # nicht zuruecksetzen darf (Eigentuemer SYSTEM, nur SYSTEM:F) — Dienst blieb gestoppt, VERSION
  # schon neu. Hier ECHT: Erstinstallation, Upgrade mit SYSTEM-eigener Datei in data\ (Exit 0,
  # WARNUNG), Gegenprobe mit 0.2.45 (bricht genau daran ab, Dienst gestoppt; ebenso an pip) und
  # ein an pip scheiterndes Upgrade mit dem aktuellen Installer (Ruecknahme, Dienst laeuft).
  installer:
    name: Installer echt (Windows, PS 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Staende 0.2.45, 0.2.46 (2ea9192) 0.2.48-beta (efbf608) 0.2.49-beta (97cc8bf) 0.2.50 (aa45770) und 0.2.51 (3095166) fuer die Gegenproben
        shell: powershell
        run: |
          git worktree add "$env:RUNNER_TEMP\stand-0245" 4d78c34
          git worktree add "$env:RUNNER_TEMP\stand-0246" 2ea9192
          git worktree add "$env:RUNNER_TEMP\stand-0248" efbf608
          git worktree add "$env:RUNNER_TEMP\stand-0249" 97cc8bf
          git worktree add "$env:RUNNER_TEMP\stand-0250" aa45770
          git worktree add "$env:RUNNER_TEMP\stand-0251" 3095166
      - name: Installieren, Upgrade mit gesperrter Datei, Abbruch mit Ruecknahme, e3, e4
        shell: powershell
        run: .\tests\installer_echt.ps1 -Gegenprobe "$env:RUNNER_TEMP\stand-0245" -Gegenprobe046 "$env:RUNNER_TEMP\stand-0246" -Gegenprobe048 "$env:RUNNER_TEMP\stand-0248" -Gegenprobe049 "$env:RUNNER_TEMP\stand-0249" -Gegenprobe050 "$env:RUNNER_TEMP\stand-0250" -Gegenprobe051 "$env:RUNNER_TEMP\stand-0251"
      - name: Protokoll des Dienstes
        if: always()
        shell: powershell
        run: Get-Content C:\ProgramData\exo-smtp-relay\data\logs\app.log -Tail 80 -ErrorAction SilentlyContinue

  # Offline-Paket wie im Release bauen (feste Quellen, Pruefsummen) und auf Windows OHNE Netz
  # fuer pip installieren: PIP_NO_INDEX, toter Index/Proxy, ausgehende Firewall-Sperre fuer
  # python.exe. Prueft Authenticode des Python-Installers samt Gegenproben, die Microsoft-
  # Signatur des Moduls, Dienststart, /health und den Offline-Weg des Updaters.
  offline:
    name: Offline-Paket (Windows, ohne Netz)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline-Stufe und Pakete bauen
        run: |
          python tools/offline_paket.py vorbereiten offline-stufe
          python tools/release.py bauen dist-offline offline-stufe
      - name: Offline installieren und pruefen
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          .\tools\offline_probe.ps1 -Paket "dist-offline\exo-smtp-relay-$v-windows-offline.zip"
      - name: Protokoll des Dienstes
        if: always()
        shell: powershell
        run: Get-Content C:\ProgramData\exo-smtp-relay\data\logs\app.log -Tail 60 -ErrorAction SilentlyContinue

  build:
    name: Container baut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t exo-smtp-relay:ci .

      # Labtest 0.2.42: Ein von Docker als root angelegtes ./data führte zur
      # Neustartschleife (PermissionError /app/data/logs). Hier genau so:
      # Bind-Mount auf ein Verzeichnis, das es noch nicht gibt — Docker legt
      # es als root an. Erwartet: healthy, Dienst als appuser, data gehört 1000.
      - name: Start mit frischem Bind-Mount (root-eigenes data)
        run: |
          test ! -e ci-data
          docker run -d --name relay-ci -v "$PWD/ci-data:/app/data" exo-smtp-relay:ci
          for i in $(seq 1 40); do
            zustand="$(docker inspect -f '{{.State.Health.Status}}' relay-ci)"
            echo "Versuch $i: $zustand"
            [ "$zustand" = "healthy" ] && break
            [ "$(docker inspect -f '{{.State.Running}}' relay-ci)" = "true" ] || break
            sleep 5
          done
          docker logs relay-ci 2>&1 | tail -40
          test "$(docker inspect -f '{{.State.Health.Status}}' relay-ci)" = "healthy"
          test "$(docker inspect -f '{{.RestartCount}}' relay-ci)" = "0"
          test "$(docker exec relay-ci sh -c 'stat -c %u /app/data /app/data/logs' | sort -u)" = "1000"
          test "$(docker exec relay-ci sh -c 'stat -c %u /proc/1')" = "1000"
          docker rm -f relay-ci
